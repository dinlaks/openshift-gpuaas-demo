# MIG small-slice profile — project-scoped per tenant namespace.
# Uses Kueue scheduling: RHOAI submits workbench workloads through the local queue.
# Node placement is handled by Kueue ResourceFlavor a30-mig-1g6gb (nodeLabels + tolerations).
# Template: ${MIG_SMALL_RESOURCE}, ${GPU_TYPE} substituted by deploy-hardware-profiles.sh via envsubst.
# Do not oc apply directly.
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: gpu-mig-small
  namespace: ds-team-project
  labels:
    app.opendatahub.io/hardwareprofile: "true"
    app.kubernetes.io/part-of: hardwareprofile
  annotations:
    opendatahub.io/display-name: "${GPU_TYPE} MIG — Small Slice (${MIG_SMALL_RESOURCE})"
    opendatahub.io/description: "Small MIG partition. Ideal for development, experiments, and lightweight inference."
    opendatahub.io/disabled: "false"
    opendatahub.io/dashboard-feature-visibility: "[]"
spec:
  identifiers:
    - displayName: "CPU"
      identifier: "cpu"
      resourceType: CPU
      minCount: 1
      maxCount: 4
      defaultCount: 2
    - displayName: "Memory"
      identifier: "memory"
      resourceType: Memory
      minCount: "2Gi"
      maxCount: "16Gi"
      defaultCount: "4Gi"
    - displayName: "GPU (MIG small)"
      identifier: "${MIG_SMALL_RESOURCE}"
      resourceType: Accelerator
      minCount: 1
      maxCount: 1
      defaultCount: 1
  scheduling:
    type: Queue
    kueue:
      localQueueName: "ds-queue"
---
apiVersion: infrastructure.opendatahub.io/v1
