# Full-GPU profile — inference-team-project only.
# Uses Kueue scheduling: RHOAI submits workbench workloads through the local queue.
# Node placement is handled by Kueue ResourceFlavor a30-full (nodeLabels + tolerations).
# Template: ${FULL_GPU_RESOURCE}, ${GPU_TYPE} substituted by deploy-hardware-profiles.sh via envsubst.
# Do not oc apply directly.
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: gpu-full
  namespace: inference-team-project
  labels:
    app.opendatahub.io/hardwareprofile: "true"
    app.kubernetes.io/part-of: hardwareprofile
  annotations:
    opendatahub.io/display-name: "${GPU_TYPE} — Full GPU (${FULL_GPU_RESOURCE})"
    opendatahub.io/description: "Dedicated full GPU. Ideal for large model inference and full-GPU training."
    opendatahub.io/disabled: "false"
    opendatahub.io/dashboard-feature-visibility: "[]"
spec:
  identifiers:
    - displayName: "CPU"
      identifier: "cpu"
      resourceType: CPU
      minCount: 4
      maxCount: 16
      defaultCount: 8
    - displayName: "Memory"
      identifier: "memory"
      resourceType: Memory
      minCount: "16Gi"
      maxCount: "64Gi"
      defaultCount: "32Gi"
    - displayName: "GPU (full)"
      identifier: "${FULL_GPU_RESOURCE}"
      resourceType: Accelerator
      minCount: 1
      maxCount: 1
      defaultCount: 1
  scheduling:
    type: Queue
    kueue:
      localQueueName: "inference-queue"
