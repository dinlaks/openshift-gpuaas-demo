apiVersion: batch/v1
kind: Job
metadata:
  name: bob-reserved-inference
  namespace: user-bob
  labels:
    demo/uc: uc10-booking
    demo/flow: flow3
    demo/user: bob
    kueue.x-k8s.io/queue-name: reserved
spec:
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        demo/uc: uc10-booking
        demo/flow: flow3
        demo/user: bob
    spec:
      restartPolicy: Never
      containers:
        - name: inference
          image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
          command: [python, -u, -c]
          args:
            - |
              import torch, time, os, socket
              gpu  = torch.cuda.get_device_name(0)
              mem  = torch.cuda.get_device_properties(0).total_memory / 1e9
              node = socket.gethostname()
              print("=" * 60)
              print("UC10 FLOW 3 — BOOKING PREEMPTION")
              print("=" * 60)
              print(f"User      : Bob (has a GPU booking)")
              print(f"GPU       : {gpu}")
              print(f"VRAM      : {mem:.1f} GB  (reserved MIG slice)")
              print(f"Node      : {node}")
              print(f"Queue     : reserved  (booking-enforced)")
              print("=" * 60)
              print("BOB RUNNING ON RESERVED SLOT — booking enforced preemption")
              print("Charlie's borrowed job was evicted to make room for this reservation.")
              x = torch.randn(2048, 2048, device='cuda')
              duration = int(os.getenv('JOB_DURATION_SECS', '600'))
              for i in range(duration // 5):
                  _ = torch.mm(x, x)
                  if i % 12 == 0:
                      print(f"  bob inference running... {i*5}s elapsed — reservation holding")
                  time.sleep(5)
          env:
            - name: JOB_DURATION_SECS
              value: "600"
          resources:
            requests:
              ${MIG_SMALL_RESOURCE}: "1"
            limits:
              ${MIG_SMALL_RESOURCE}: "1"
