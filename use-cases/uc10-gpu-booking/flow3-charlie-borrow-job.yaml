apiVersion: batch/v1
kind: Job
metadata:
  name: charlie-reserved-medium
  namespace: user-charlie
  labels:
    demo/uc: uc10-booking
    demo/flow: flow3
    demo/user: charlie
    kueue.x-k8s.io/queue-name: reserved
    kueue.x-k8s.io/priority-class: medium-priority
spec:
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        demo/uc: uc10-booking
        demo/flow: flow3
        demo/user: charlie
        kueue.x-k8s.io/priority-class: medium-priority
    spec:
      restartPolicy: Never
      containers:
        - name: inference
          image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
          command: [python, -u, -c]
          args:
            - |
              import torch, time, os, socket
              gpu  = torch.cuda.get_device_name(0)
              mem  = torch.cuda.get_device_properties(0).total_memory / 1e9
              node = socket.gethostname()
              print("=" * 60)
              print("UC10 FLOW 3 — PRE-EMPTION DEMO (Charlie side)")
              print("=" * 60)
              print(f"User      : Charlie (medium-priority booking)")
              print(f"GPU       : {gpu}")
              print(f"VRAM      : {mem:.1f} GB")
              print(f"Node      : {node}")
              print(f"Priority  : medium-priority (500)")
              print("=" * 60)
              print("CHARLIE RUNNING — will be cancelled via booking portal to release slot for Bob")
              x = torch.randn(2048, 2048, device='cuda')
              duration = int(os.getenv('JOB_DURATION_SECS', '600'))
              for i in range(duration // 5):
                  _ = torch.mm(x, x)
                  if i % 12 == 0:
                      print(f"  charlie running... {i*5}s elapsed")
                  time.sleep(5)
          env:
            - name: JOB_DURATION_SECS
              value: "3600"
          resources:
            requests:
              ${MIG_SMALL_RESOURCE}: "1"
            limits:
              ${MIG_SMALL_RESOURCE}: "1"
