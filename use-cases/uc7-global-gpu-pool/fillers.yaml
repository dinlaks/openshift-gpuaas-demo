# UC7: Cluster A fillers — occupy all 4× mig-1g.6gb slots on Cluster A
#
# Cluster A has 4× mig-1g.6gb (GPU 0 only). Fill them across team queues:
#   - charlie's research-queue:  nominalQuota=1 + borrowing=3 → fills 4 total
#
# After applying this file, all 4 Cluster A MIG slots are occupied.
# Submitting 07-uc7-demo-job.yaml to global-queue then forces MultiKueue
# to dispatch to Cluster B (which has 6× mig-1g.6gb free).

apiVersion: batch/v1
kind: Job
metadata:
  name: uc7-cluster-a-filler-1
  namespace: research-team-project
  labels:
    demo/uc: uc7-filler
    kueue.x-k8s.io/queue-name: research-queue
    kueue.x-k8s.io/priority-class: medium-priority
spec:
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        demo/uc: uc7-filler
        kueue.x-k8s.io/queue-name: research-queue
        kueue.x-k8s.io/priority-class: medium-priority
    spec:
      restartPolicy: Never
      containers:
        - name: filler
          image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
          command: [python, -u, -c]
          args:
            - |
              import torch, time, os
              mem = torch.cuda.get_device_properties(0).total_memory / 1e9
              n = min(int((mem * 0.4 * 1e9 / 4) ** 0.5), 8192)
              x = torch.randn(n, n, device='cuda')
              print(f"[filler-1] Holding Cluster A slot 1/4 | VRAM: {mem:.1f}GB")
              duration = int(os.getenv('JOB_DURATION_SECS', '3600'))
              start, i = time.time(), 0
              while time.time() - start < duration:
                  _ = torch.mm(x, x)
                  if i % 30 == 0: print(f"  [filler-1] compute running... {int(time.time()-start)}s elapsed")
                  time.sleep(0.2); i += 1
          resources:
            requests:
              ${MIG_SMALL_RESOURCE}: "1"
            limits:
              ${MIG_SMALL_RESOURCE}: "1"
---
