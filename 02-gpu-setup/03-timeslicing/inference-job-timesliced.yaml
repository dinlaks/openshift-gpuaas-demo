# Time-Slicing Demo Jobs — TIMESLICE_REPLICAS concurrent inference jobs on shared GPU 1.
# All pods run simultaneously on the same GPU, proving time-slicing is active.
# Each sees the full GPU memory — time-slicing shares compute time, not memory.
#
# Template: ${TIMESLICE_REPLICAS} substituted by configure-timeslicing.sh via apply_template.
# Do not oc apply directly — run configure-timeslicing.sh which sets up time-slicing and
# submits these jobs in one step.
#
# Watch:  oc get pods -n ds-team-project -l demo/scenario=timeslicing -w
# Logs:   oc logs -n ds-team-project -l demo/scenario=timeslicing --prefix --follow --tail=5
# Clean:  bash 02-gpu-setup/03-timeslicing/teardown-timeslicing.sh
apiVersion: batch/v1
kind: Job
metadata:
  name: timeslice-inference
  namespace: ds-team-project
  labels:
    demo/scenario: timeslicing
    demo/uc: uc-timeslice
    kueue.x-k8s.io/queue-name: ds-queue
spec:
  parallelism: ${TIMESLICE_REPLICAS}
  completions: ${TIMESLICE_REPLICAS}
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        demo/scenario: timeslicing
        demo/uc: uc-timeslice
        kueue.x-k8s.io/queue-name: ds-queue
    spec:
      restartPolicy: Never
      nodeSelector:
        demo/gpu-has-full: "true"
      containers:
        - name: inference
          image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
          command: [python, -u, -c]
          args:
            - |
              import torch, time, os, socket

              if not torch.cuda.is_available():
                  raise RuntimeError("No GPU available")

              pod = socket.gethostname()
              gpu = torch.cuda.get_device_name(0)
              mem = torch.cuda.get_device_properties(0).total_memory / 1e9
              duration = int(os.environ.get("JOB_DURATION_SECS", "1800"))

              print(f"[{pod}] GPU: {gpu} | Memory: {mem:.1f}GB | Sharing via time-slicing")

              size = 4096
              a = torch.randn(size, size, device="cuda")
              b = torch.randn(size, size, device="cuda")

              start = time.time()
              iteration = 0
              while time.time() - start < duration:
                  c = torch.matmul(a, b)
                  iteration += 1
                  if iteration % 100 == 0:
                      elapsed = time.time() - start
                      tflops = 2 * size**3 * iteration / elapsed / 1e12
                      used_gb = torch.cuda.memory_allocated() / 1e9
                      print(f"[{pod}] {elapsed:.0f}s | {tflops:.2f} TFLOPS | mem={used_gb:.2f}GB")
              print(f"[{pod}] Done — {iteration} iterations")
          env:
            - name: JOB_DURATION_SECS
              value: "1800"
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
