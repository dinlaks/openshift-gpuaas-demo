apiVersion: opendatahub.io/v1alpha
kind: OdhDashboardConfig
metadata:
  name: odh-dashboard-config
  namespace: redhat-ods-applications
spec:
  groupsConfig:
    adminGroups: "gpuaas-platform-admins"
    allowedGroups: "gpu-inference-users,gpu-standard-users,gpu-research-users,gpu-finetune-users,cpu-only-users"
  notebookController:
    enabled: true
    notebookNamespace: rhods-notebooks
    notebookTolerationSettings:
      enabled: false
  dashboardConfig:
    enablement: true
    disableInfo: false
    disableSupport: false
    disableClusterManager: false
    disableTrackingEvents: true
    enabledUserProjects: true
    disableBYONImageStream: false
    disableISVBadges: false
    disableAppLauncher: false
    disableUserManagement: false
    modelMetricsNamespace: ""
    genAiStudio: true
    disableKueue: false
    disableProjectScoped: false
    disableLMEval: false
    gpuaas: true
    connectionTest: true
    projectRBAC: true
    agentsCatalog: true
    agentOps: true
    externalModels: true
    mcpCatalog: true
    mcpRegistry: true
    autorag: true
    guardrails: true
    agentConfigManagement: true
    genAiTracing: true
    promptManagement: true
    globalProjectPrompts: true
    automl: true
    llmdTemplates: true
    vLLMDeploymentOnMaaS: true
  hardwareProfileOrder:
    - gpu-mig-small
    - gpu-mig-large
    - gpu-full
    - cpu-only
