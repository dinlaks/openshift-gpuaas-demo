# UC7: Global GPU Pool — Cross-Cluster Dispatch
#
# Submits one Job to the global queue. MultiKueue dispatches it to whichever
# cluster has available GPU capacity — automatically, transparently.
#
# Demo flow:
#   Step 1 (optional): Run 07-uc7-cluster-a-fillers.yaml to fill Cluster A's slots
#   Step 2: Submit this Job — MultiKueue checks both clusters, dispatches to spoke
#   Step 3: Confirm pod running on spoke cluster (not hub)
#
# Key message: "Submit once to global-queue. Platform picked the cluster."
#
# Cleanup: bash cleanup.sh uc7

apiVersion: batch/v1
kind: Job
metadata:
  name: global-inference-job
  namespace: inference-team-project
  labels:
    demo/uc: uc7-multi-cluster
    demo/user: alice
    kueue.x-k8s.io/queue-name: global-queue
spec:
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        demo/uc: uc7-multi-cluster
        demo/user: alice
    spec:
      restartPolicy: Never
      securityContext: {}   # let spoke assign its own namespace-valid security context
      containers:
        - name: inference
          image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
          command: [python, -u, -c]
          args:
            - |
              import torch, time, socket
              hostname = socket.gethostname()
              gpu = torch.cuda.get_device_name(0)
              mem = torch.cuda.get_device_properties(0).total_memory / 1e9
              print("=" * 60)
              print("UC7: GLOBAL GPU POOL — CROSS-CLUSTER DISPATCH")
              print("=" * 60)
              print(f"Running on node : {hostname}")
              print(f"GPU             : {gpu}")
              print(f"GPU Memory      : {mem:.1f} GB  (${MIG_SMALL_RESOURCE} MIG slice)")
              print("User submitted to global-queue — no cluster specified")
              print("Platform dispatched to whichever cluster had capacity")
              print("=" * 60)
              x = torch.randn(2048, 2048, device='cuda')
              for i in range(36):       # 36 × 15s = 9 min — gives presenter time to show all steps
                  _ = torch.mm(x, x)
                  print(f"  inference step {i+1}/36 | GPU mem: {torch.cuda.memory_allocated()/1e9:.2f}GB")
                  time.sleep(15)
              print("Job complete — ran on whichever cluster had capacity!")
          resources:
            requests:
              ${MIG_SMALL_RESOURCE}: "1"
            limits:
              ${MIG_SMALL_RESOURCE}: "1"
